<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Jadwal Sholat — AdhanCast</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/tv.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%230F766E%22/><path d=%22M6 19v-6a6 6 0 0 1 12 0v6z%22 fill=%22%23fff%22/></svg>">
</head>
<body>
  <div class="tv-background-layer" id="tv-bg-layer" aria-hidden="true"></div>
  <div class="tv-background-overlay" id="tv-bg-overlay" aria-hidden="true"></div>

  <!-- HEADER: clock · mosque identity · dates -->
  <header class="tv-header-bar">
    <div class="header-clock">
      <span class="clock-main" id="clock-main">00:00</span>
      <span class="clock-sec" id="clock-sec" aria-hidden="true">00</span>
    </div>

    <div class="header-mosque">
      <h1 id="mosque-name">Memuat nama masjid…</h1>
      <p id="mosque-address"></p>
    </div>

    <div class="header-calendar">
      <span class="gregorian" id="gregorian-date">…</span>
      <span class="hijri" id="hijri-date">…</span>
    </div>
  </header>

  <!-- STATUS BAR -->
  <nav class="tv-sub-bar" aria-label="Status layar">
    <div class="sub-bar-left">
      <span class="tv-chip" id="chip-network" data-state="online">
        <iconify-icon icon="lucide:wifi" aria-hidden="true"></iconify-icon>
        <span id="chip-network-text">Terhubung</span>
      </span>
      <button type="button" class="tv-chip tv-chip-button" id="btn-audio-toggle" aria-label="Tes suara bip azan">
        <iconify-icon icon="lucide:volume-2" aria-hidden="true"></iconify-icon>
      </button>
    </div>

    <div class="sub-bar-right">
      <div class="tv-countdown" id="tv-floating-badge" role="timer" aria-live="off">
        <span class="countdown-label" id="badge-countdown-label">Menuju</span>
        <span class="countdown-value" id="badge-countdown-text">--:--:--</span>
      </div>
      <a href="/admin" class="tv-settings-link" aria-label="Buka panel pengaturan">
        <iconify-icon icon="lucide:settings" aria-hidden="true"></iconify-icon>
      </a>
    </div>
  </nav>

  <!-- CENTER STAGE: agenda slides alternating with the clean background -->
  <main class="tv-center-stage" id="tv-center-stage" aria-live="polite"></main>

  <!-- PRAYER DECK -->
  <section class="tv-prayer-ribbon" aria-label="Jadwal sholat hari ini">
    <ol class="prayer-cards-deck" id="prayer-cards-deck"></ol>
  </section>

  <!-- TWO-TIER TICKER -->
  <footer class="tv-dual-ticker">
    <div class="ticker-tier ticker-tier-info">
      <span class="ticker-label">Info</span>
      <div class="ticker-window">
        <div class="ticker-scroll" id="ticker-dark-content"></div>
      </div>
    </div>
    <div class="ticker-tier ticker-tier-reminder">
      <span class="ticker-label">Pengingat</span>
      <div class="ticker-window">
        <p class="ticker-static" id="ticker-red-content"></p>
      </div>
    </div>
  </footer>

  <!-- FULLSCREEN STATE SCREENS (non-interactive status, not dialogs) -->
  <div class="tv-full-overlay overlay-azan" id="overlay-azan" role="status" aria-live="assertive">
    <div class="azan-lead" id="azan-lead">Waktu sholat telah tiba</div>
    <div class="azan-hero" id="azan-prayer-hero">Adzan</div>
  </div>

  <div class="tv-full-overlay overlay-iqomah" id="overlay-iqomah" role="status">
    <div class="iqomah-lead" id="iqomah-prayer-lead">Iqomah</div>
    <div class="iqomah-timer" id="iqomah-timer">00:00</div>
    <div class="iqomah-note">Matikan atau senyapkan ponsel Anda</div>
  </div>

  <div class="tv-full-overlay overlay-salat" id="overlay-salat" role="status">
    <div class="salat-text">Luruskan &amp; rapatkan shaf</div>
  </div>

  <script src="/js/prayer-engine.js"></script>
  <script src="/js/tv.js"></script>
</body>
</html>
