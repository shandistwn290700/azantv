<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdhanCast - Portal Masjid</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%235e72e4%22 stroke-width=%222%22><path d=%22M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z%22/></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
    body {
      background-color: #f8f9fe;
      color: #32325d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .hero-banner {
      background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%);
      padding: 60px 20px 130px 20px;
      text-align: center;
      color: #ffffff;
      position: relative;
    }
    .hero-banner h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    .hero-banner p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }
    .separator-skew {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      line-height: 0;
    }
    .separator-skew svg {
      width: 100%;
      height: 60px;
      fill: #f8f9fe;
    }
    .portal-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -80px;
      padding: 0 24px 40px 24px;
      z-index: 10;
    }
    .portal-container {
      max-width: 680px;
      width: 100%;
    }
    .portal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .portal-grid { grid-template-columns: 1fr; }
    }
    .portal-card {
      background: #ffffff;
      border-radius: 8px;
      padding: 28px 24px;
      box-shadow: 0 0 2rem 0 rgba(136, 152, 170, 0.15);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      border: 1px solid #e9ecef;
    }
    .portal-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
      border-color: #5e72e4;
    }
    .card-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: #ffffff;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(50, 50, 93, 0.1);
    }
    .icon-tv { background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%); }
    .icon-admin { background: linear-gradient(87deg, #11cdef 0, #1171ef 100%); }
    .portal-card h3 {
      font-size: 17px;
      font-weight: 700;
      color: #32325d;
      margin-bottom: 4px;
    }
    .portal-card p {
      font-size: 13px;
      color: #8898aa;
      line-height: 1.45;
    }
    .btn-action-portal {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #5e72e4;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="hero-banner">
    <h1>AdhanCast</h1>
    <p>Sistem Display Jadwal Sholat Digital Masjid</p>
    <div class="separator-skew">
      <svg viewBox="0 0 2560 100" preserveAspectRatio="none">
        <polygon points="2560 0 2560 100 0 100"></polygon>
      </svg>
    </div>
  </div>

  <div class="portal-wrap">
    <div class="portal-container">
      <div class="portal-grid">
        <a href="/tv" class="portal-card">
          <div>
            <div class="card-icon-box icon-tv">
              <iconify-icon icon="lucide:tv"></iconify-icon>
            </div>
            <h3>Display Google TV</h3>
            <p>Layar jadwal azan, countdown iqamah, dan salat berjamaah.</p>
          </div>
          <div class="btn-action-portal">Buka Display TV →</div>
        </a>

        <a href="/admin" class="portal-card">
          <div>
            <div class="card-icon-box icon-admin">
              <iconify-icon icon="lucide:settings"></iconify-icon>
            </div>
            <h3>Panel Admin</h3>
            <p>Pengaturan lokasi hisab, timer iqamah, kas, dan konten TV.</p>
          </div>
          <div class="btn-action-portal">Buka Admin →</div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
